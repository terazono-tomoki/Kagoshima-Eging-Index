# このファイルをコピーして .streamlit/secrets.toml を作成してください（secrets.toml はコミットしないこと）。
# Streamlit Community Cloud では App の Secrets に同じキーを設定します。

records_section_password = "ここを自分のパスワードに変更"

# Neon / Supabase などの PostgreSQL 接続文字列（postgresql:// または postgres://）
catch_records_database_url = "postgresql://USER:PASSWORD@HOST/DBNAME"

# ホストが DATABASE_URL だけを渡す場合は、次の1行でも可（postgresql で始まる場合のみ釣果 DB に使います）
# DATABASE_URL = "postgresql://USER:PASSWORD@HOST/DBNAME"

# --- 以下は任意（写真を S3 互換ストレージに置くとき）---
